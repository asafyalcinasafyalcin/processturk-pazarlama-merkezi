<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:__W__px;height:__H__px;background:#f0f2f5;
    font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;color:#050505;
    display:flex;align-items:center;justify-content:center}
  .card{width:__CARDW__px;background:#fff;border-radius:10px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.04)}
  /* header */
  .hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
  .av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;background:#071739;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .av img{width:84%;height:auto}
  .hn{flex:1;min-width:0}
  .nm{font-size:15px;font-weight:600;line-height:1.2}
  .sp{font-size:12px;color:#65676b;display:flex;align-items:center;gap:4px;margin-top:1px}
  .sp .globe{width:12px;height:12px;border-radius:50%;border:1.4px solid #65676b;display:inline-block}
  .dots{color:#65676b;font-size:20px;font-weight:700;letter-spacing:1px;padding:0 4px}
  /* primary text */
  .pt{padding:2px 12px 10px;font-size:14px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* creative */
  .cr{width:100%;height:__IMGH__px;display:block;object-fit:cover;background:#071739}
  /* link card */
  .lc{display:flex;align-items:center;gap:10px;background:#f0f2f5;padding:11px 12px}
  .lt{flex:1;min-width:0}
  .eb{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#65676b}
  .hl{font-size:15px;font-weight:700;line-height:1.25;margin-top:2px;color:#080809;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sl{font-size:12px;color:#65676b;margin-top:2px}
  .cta{flex:0 0 auto;background:#e4e6eb;color:#050505;font-weight:700;font-size:13px;
    padding:9px 14px;border-radius:7px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .wa{width:15px;height:15px;border-radius:50%;background:#25d366;flex:0 0 15px;
    display:flex;align-items:center;justify-content:center}
  .wa::before{content:"";width:7px;height:7px;border:1.6px solid #fff;border-radius:50% 50% 50% 2px;transform:rotate(8deg)}
  /* actions */
  .ac{display:flex;border-top:1px solid #ced0d4;padding:2px 0}
  .ab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 0;color:#65676b;font-size:14px;font-weight:600}
  .ic{width:17px;height:17px;display:inline-block;opacity:.7}
  .ic.like{border:1.8px solid #65676b;border-radius:3px 3px 3px 0;border-bottom:none;border-left:none;transform:rotate(0)}
</style>
</head>
<body>
  <div class="card">
    <div class="hd">
      <div class="av"><img src="__AVATAR__" alt=""></div>
      <div class="hn">
        <div class="nm">__PAGE__</div>
        <div class="sp">__SPONSORED__ <span class="globe"></span></div>
      </div>
      <div class="dots">⋯</div>
    </div>
    <div class="pt">__PRIMARY__</div>
    <img class="cr" src="__CREATIVE__" alt="">
    <div class="lc">
      <div class="lt">
        <div class="eb">__EYEBROW__</div>
        <div class="hl">__HEADLINE__</div>
        <div class="sl">__SUBLINE__</div>
      </div>
      <div class="cta"><span class="wa"></span>__CTA__</div>
    </div>
    <div class="ac">
      <div class="ab"><span class="ic like"></span>__A_LIKE__</div>
      <div class="ab">💬 __A_COMMENT__</div>
      <div class="ab">↪ __A_SHARE__</div>
    </div>
  </div>
</body>
</html>
