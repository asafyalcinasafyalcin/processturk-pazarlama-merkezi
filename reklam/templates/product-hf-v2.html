<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Cairo:wght@600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');
  :root{ --navy:__NAVY__; --red:__RED__; --wa:#25D366; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:__W__px;height:__H__px;overflow:hidden}
  .stage{position:relative;width:__W__px;height:__H__px;overflow:hidden;color:#fff;
    font-family:'Inter','Noto Sans Arabic',system-ui,sans-serif;background:var(--navy)}

  /* 1) Bulanık fabrika arka planı — sadece derinlik/atmosfer (makineyi KIRPMAZ) */
  .bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;z-index:0;
    filter:blur(16px) brightness(.42) saturate(.85)}
  /* Marka tonu + odak için degrade perde */
  .veil{position:absolute;inset:0;z-index:1;
    background:
      radial-gradient(120% 75% at 50% 30%, rgba(7,23,57,.20) 0%, rgba(7,23,57,.62) 60%, rgba(4,10,26,.90) 100%),
      linear-gradient(180deg, rgba(7,23,57,.78) 0%, rgba(7,23,57,0) 22%, rgba(4,10,26,0) 52%, rgba(3,8,20,.92) 100%)}
  /* makine altı yumuşak zemin gölgesi/ışığı */
  .floor{position:absolute;left:50%;top:828px;transform:translateX(-50%);
    width:560px;height:90px;z-index:1;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 72%)}

  /* 2) TAM makine (cutout, şeffaf) — kırpılmadan, ortalanmış */
  .machine{position:absolute;left:50%;top:150px;transform:translateX(-50%);
    height:702px;width:auto;z-index:2;filter:drop-shadow(0 26px 40px rgba(0,0,0,.55))}
  /* küçük kavanozlar — "granül dolduruyor" sinyali, dolum hunisinin önünde */
  .jars{position:absolute;left:50%;top:742px;transform:translateX(-50%);
    height:128px;width:auto;z-index:3;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}

  /* 3) Üst marka şeridi */
  .pad{position:absolute;inset:0;padding:56px 58px;z-index:4;display:flex;flex-direction:column}
  .logo{height:42px;width:auto;max-width:56%;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
  .badgerow{margin-top:15px;display:flex}
  .badge{font-weight:600;font-size:19px;letter-spacing:.01em;
    background:rgba(7,23,57,.46);border:1px solid rgba(255,255,255,.30);backdrop-filter:blur(3px);
    padding:.55em .95em;border-radius:999px;white-space:nowrap;color:#fff}

  /* 4) Alt metin kartı — okunur, makinenin ALTINDA (üstüne binmez) */
  .info{position:absolute;left:58px;right:58px;bottom:200px;z-index:4;display:flex;flex-direction:column;gap:12px}
  .name{font-family:'Montserrat','Cairo',sans-serif;font-weight:800;font-size:56px;line-height:1.02;
    letter-spacing:-.01em;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  .price{display:flex;align-items:baseline;gap:.34em;flex-wrap:wrap;font-family:'Montserrat','Cairo',sans-serif}
  .price .pre{font-weight:700;font-size:31px;color:#fff;opacity:.95}
  .price .num{font-weight:900;font-size:86px;color:var(--red);line-height:.96;letter-spacing:-.01em;
    text-shadow:0 3px 18px rgba(255,50,85,.30)}
  .sub{font-weight:600;font-size:30px;color:#fff;opacity:.95;text-shadow:0 1px 10px rgba(0,0,0,.6)}

  /* 5) WhatsApp ipucu — alt güvenli alanın ÜSTÜNDE, Meta'nın butonuyla çakışmaz */
  .wa{position:absolute;left:58px;bottom:120px;z-index:4;display:inline-flex;align-items:center;gap:.5em;
    font-weight:700;font-size:26px;color:#fff}
  .wa .dot{width:1.55em;height:1.55em;border-radius:50%;background:var(--wa);display:inline-flex;
    align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,211,102,.45)}
  .wa .dot svg{width:1em;height:1em;fill:#fff}

  /* ALT %15 GÜVENLİ ALAN (≈1135px altı) — kritik içerik YOK; Meta butonu/başlığı buraya gelir */
  .safe{position:absolute;left:0;right:0;bottom:0;height:108px;z-index:4;
    display:flex;align-items:center;padding:0 58px}
  .safe .site{font-weight:600;font-size:22px;color:rgba(255,255,255,.42);letter-spacing:.05em;
    direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="__SCENE__" alt="">
    <div class="veil"></div>
    <div class="floor"></div>
    <img class="machine" src="__MACHINE__" alt="">
    <img class="jars" src="__JARS__" alt="">

    <div class="pad">
      <img class="logo" src="__LOGO__" alt="__BRAND__">
      <div class="badgerow"><div class="badge">__BADGE_LINE__</div></div>
    </div>

    <div class="info">
      <div class="name">__NAME__</div>
      <div class="price"><span class="pre">__PRICE_PRE__</span><span class="num">__PRICE_NUM__</span></div>
      <div class="sub">__SUB__</div>
    </div>

    <div class="wa">
      <span class="dot"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.506 5.26l-.999 3.648 3.992-1.612zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg></span>
      __CTA__
    </div>

    <div class="safe"><div class="site">__SITE__</div></div>
  </div>
</body>
</html>
