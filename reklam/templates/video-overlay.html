<!doctype html>
<!--
  ProcessTürk video marka katmanı — ŞEFFAF.
  make_video_overlay.py bunu render eder (Chrome --default-background-color=00000000),
  çıkan şeffaf PNG ffmpeg ile videonun üstüne bindirilir. Foto YOK; sadece marka öğeleri
  + alttan okunabilirlik degradesi. overlay.html'in video için şeffaf kardeşi.
-->
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap');
  :root{ --navy:#071739; --red:#FF3255; --white:#ffffff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:__W__px;height:__H__px;overflow:hidden;background:transparent}
  .stage{position:relative;width:__W__px;height:__H__px;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;color:var(--white)}
  /* Üstte hafif, altta güçlü navy degrade — orta kısım (ürün videosu) açık kalır */
  .scrim-top{position:absolute;top:0;left:0;right:0;height:22%;
    background:linear-gradient(180deg, rgba(7,23,57,.62) 0%, rgba(7,23,57,0) 100%)}
  .scrim-bot{position:absolute;bottom:0;left:0;right:0;height:46%;
    background:linear-gradient(0deg, rgba(7,23,57,.97) 0%, rgba(7,23,57,.86) 42%, rgba(7,23,57,0) 100%)}
  .pad{position:absolute;inset:0;padding:__PAD__px;display:flex;flex-direction:column;justify-content:flex-end}
  .top{display:__TOPDISP__;align-items:center;justify-content:space-between;gap:16px;margin-bottom:auto}
  .badge{font-family:'Inter';font-weight:600;font-size:__BADGE__px;letter-spacing:.02em;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
    padding:.55em .9em;border-radius:999px;backdrop-filter:blur(4px);white-space:nowrap}
  .brand{font-family:'Montserrat';font-weight:800;font-size:__BRAND__px;letter-spacing:.01em;white-space:nowrap}
  .brand b{color:var(--red)}
  .bottom{display:flex;flex-direction:column;gap:__GAP__px}
  .pricepre{font-family:'Inter';font-weight:600;font-size:__PRICEPRE__px;color:rgba(255,255,255,.82);letter-spacing:.01em}
  .price{font-family:'Montserrat';font-weight:900;font-size:__PRICE__px;line-height:.95;letter-spacing:-.02em}
  .price b{color:var(--red)}
  .head{font-family:'Montserrat';font-weight:700;font-size:__HEAD__px;line-height:1.05;max-width:94%}
  .sub{font-family:'Inter';font-weight:500;font-size:__SUB__px;line-height:1.3;color:rgba(255,255,255,.88);max-width:92%}
  .cta{align-self:flex-start;margin-top:__CTAMT__px;background:var(--red);color:#fff;
    font-family:'Montserrat';font-weight:800;font-size:__CTA__px;letter-spacing:.01em;
    padding:.7em 1.25em;border-radius:__RAD__px;display:inline-flex;align-items:center;gap:.5em}
  .cta::before{content:"";width:.9em;height:.9em;border-radius:50%;background:#fff;opacity:.95;
    box-shadow:0 0 0 .18em rgba(255,255,255,.25)}
  [dir="rtl"] .top{flex-direction:row-reverse}
  [dir="rtl"] .cta{align-self:flex-end}
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim-top"></div>
    <div class="scrim-bot"></div>
    <div class="pad">
      <div class="top">
        <div class="badge">__BADGE_TEXT__</div>
        <div class="brand">Process<b>Türk</b></div>
      </div>
      <div class="bottom">
        <div class="pricepre">__PRICEPRE_TEXT__</div>
        <div class="price">__PRICE_TEXT__</div>
        <div class="head">__HEAD_TEXT__</div>
        <div class="sub">__SUB_TEXT__</div>
        <div class="cta">__CTA_TEXT__</div>
      </div>
    </div>
  </div>
</body>
</html>
